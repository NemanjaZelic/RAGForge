name: CI

on:
  push:
    branches-ignore: ["results/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/export_schemas.py --check
      - run: uv build
      - run: uv run --no-sync python scripts/check_distribution.py dist
  real-model:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    env:
      RAGFORGE_MODEL_DIR: .cache/real-model
      RAGFORGE_RERANKER_DIR: .cache/real-reranker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - uses: actions/cache@v4
        id: model-cache
        with:
          path: .cache/real-model
          key: e5-small-${{ runner.os }}-614241f-${{ hashFiles('scripts/prepare_models.py', 'src/ragforge/core/embedding.py') }}
      - if: steps.model-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync python scripts/prepare_models.py e5-small .cache/real-model
      - uses: actions/cache@v4
        id: reranker-cache
        with:
          path: .cache/real-reranker
          key: ms-marco-reranker-${{ runner.os }}-233902d-${{ hashFiles('scripts/prepare_reranker.py', 'src/ragforge/core/rerank.py') }}
      - if: steps.reranker-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync python scripts/prepare_reranker.py .cache/real-reranker
      - name: Pretrained model offline build and query
        run: uv run --no-sync pytest tests/test_real_model.py tests/test_shared_http.py::test_real_model_shared_parity_and_prepared_connection -q
      - name: Linux OS network isolation
        if: runner.os == 'Linux'
        run: sudo --preserve-env=RAGFORGE_MODEL_DIR,RAGFORGE_RERANKER_DIR unshare --net .venv/bin/python -m pytest tests/test_real_model.py -q

  quickstart-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            models/e5-small
            models/mmarco-minilm-reranker
            models/ms-marco-minilm-reranker
          key: quickstart-linux-e5-mmarco-${{ hashFiles('scripts/prepare_models.py', 'scripts/prepare_reranker.py', 'scripts/setup_models.py') }}
      - name: Prepare the documented Python prerequisite
        run: uv python install 3.13
      - name: First Linux setup through the user command
        run: bash setup.sh --python "$(uv python find 3.13)"
      - name: Repeated setup without network downloads
        run: bash setup.sh --offline --python "$(uv python find 3.13)"
      - name: Build, search and prepare agent through native Bash launchers
        run: |
          bash ragforge.sh build examples/mini-docs
          bash ragforge.sh ask "How are access tokens sent?"
          bash ragforge.sh agent --output ".cache/agent with spaces"
      - name: Actual generated agent configuration
        run: .venv/bin/python scripts/check_quickstart_mcp.py ".cache/agent with spaces/mcp.json"

      - name: Explicit English documentation setup through the user command
        run: bash setup.sh --document-language en --python "$(uv python find 3.13)"
      - name: Reuse the English profile entirely offline
        run: bash setup.sh --document-language en --offline --python "$(uv python find 3.13)"
      - name: Build the English profile and generate its agent skill
        run: |
          bash ragforge.sh build examples/mini-docs
          bash ragforge.sh agent --output ".cache/English agent with spaces"
      - name: English profile actual generated MCP connection
        run: .venv/bin/python scripts/check_quickstart_mcp.py ".cache/English agent with spaces/mcp.json"

  docker-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - name: Verify public Docker proxy, TLS, auth and retrieval
        env:
          RAGFORGE_TEST_DOCKER: "1"
        run: uv run --no-sync pytest tests/test_public_docker.py -q
